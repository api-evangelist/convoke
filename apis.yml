aid: convoke
name: Convoke
description: >-
  Convoke is building an AI-native operating system for the biopharmaceutical
  industry. Founded in 2024 and based in South San Francisco, the platform
  unifies fragmented internal knowledge, workflows, and external data into a
  continuously updating workspace, codifies the decision logic behind
  high-stakes choices, and generates critical deliverables such as competitive
  intelligence briefs, portfolio strategy analyses, market research, and
  scientific manuscripts across the drug development lifecycle. Convoke serves
  biopharma teams working in business development, competitive intelligence,
  portfolio strategy, market research, and medical affairs. The company raised
  an $8.6M seed round co-led by Kleiner Perkins and Dimension. As of this
  profile, Convoke publishes a public marketing and company site but no public
  developer API, SDK, or documentation surface.
